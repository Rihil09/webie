<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR-RICE Dashboard</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="dashboard.css">

</head>


<body>


<!-- ================================================= -->
<!-- TOP NAVBAR -->
<!-- ================================================= -->

<header class="topbar">

    <!-- LOGO -->

    <div class="logo">

        <i class="fa-solid fa-seedling"></i>

        <span>AR-RICE</span>

    </div>


    <!-- LOGOUT -->

    <div class="navbar-right">

        <button id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </button>

    </div>

</header>



<!-- ================================================= -->
<!-- SIDEBAR -->
<!-- ================================================= -->

<aside class="sidebar">

    <div class="menu-title">
        MENU
    </div>


    <!-- DASHBOARD -->

    <button class="menu-btn active">

        <i class="fa-solid fa-chart-line"></i>

        <span>Dashboard</span>

    </button>


    <!-- CAMERA -->

    <button class="menu-btn">

        <i class="fa-solid fa-video"></i>

        <span>Camera</span>

    </button>


    <!-- PEST DETECTION -->

    <button class="menu-btn">

        <i class="fa-solid fa-bug"></i>

        <span>Pest Detection</span>

    </button>


    <!-- ROBOT LOCATION -->

    <button class="menu-btn">

        <i class="fa-solid fa-location-dot"></i>

        <span>Robot Location</span>

    </button>

</aside>



<!-- ================================================= -->
<!-- MAIN CONTENT -->
<!-- ================================================= -->

<main class="main-content">


    <!-- ================================================= -->
    <!-- WELCOME USER -->
    <!-- ================================================= -->

    <section class="welcome-card">

        <div class="welcome-text">

            <h1>
                Welcome, <span id="username">...</span>!
            </h1>

            <p>
                AR-RICE monitors the rice field in real-time
                using the Raspberry Pi robot.
            </p>

        </div>

    </section>



    <!-- ================================================= -->
    <!-- TOP CARDS -->
    <!-- ================================================= -->

    <section class="cards">


        <!-- ================================================= -->
        <!-- LIVE CAMERA -->
        <!-- ================================================= -->

        <div class="card large-card">

            <div class="card-header">

                <h3>

                    <i class="fa-solid fa-video"></i>

                    Live Camera

                </h3>

            </div>


            <div class="camera-feed">

                <img
                    id="cameraFeed"
                    src="images/camera-placeholder.png"
                    alt="Camera Feed"
                >

            </div>

        </div>



        <!-- ================================================= -->
        <!-- RIGHT COLUMN -->
        <!-- ================================================= -->

        <div class="right-column">


            <!-- ================================================= -->
            <!-- DETECTED PESTS -->
            <!-- ================================================= -->

            <div class="card small-card">

                <div class="card-header">

                    <h3>

                        <i class="fa-solid fa-bug"></i>

                        Detected Pests

                    </h3>

                </div>


                <div
                    class="big-number"
                    id="pestCount"
                >
                    12
                </div>

            </div>



            <!-- ================================================= -->
            <!-- ROBOT LOCATION -->
            <!-- ================================================= -->

            <div class="card small-card">

                <div class="card-header">

                    <h3>

                        <i class="fa-solid fa-location-dot"></i>

                        Robot Location

                    </h3>

                </div>


                <div
                    class="location-text"
                    id="robotLocation"
                >
                    Field Zone A3
                </div>

            </div>


        </div>

    </section>



    <!-- ================================================= -->
    <!-- SECOND ROW -->
    <!-- ================================================= -->

    <section class="cards second-row">


        <!-- ================================================= -->
        <!-- ROBOT STATUS -->
        <!-- ================================================= -->

        <div class="card">

            <div class="card-header">

                <h3>

                    <i class="fa-solid fa-robot"></i>

                    Robot Status

                </h3>

            </div>


            <div class="status">


                <!-- BATTERY -->

                <div>

                    <span>Battery</span>

                    <strong id="battery">
                        95%
                    </strong>

                </div>


                <!-- TEMPERATURE -->

                <div>

                    <span>Temperature</span>

                    <strong id="temperature">
                        32°C
                    </strong>

                </div>


                <!-- CONNECTION -->

                <div>

                    <span>Connection</span>

                    <strong
                        class="online"
                        id="connectionStatus"
                    >
                        Online
                    </strong>

                </div>


            </div>

        </div>



        <!-- ================================================= -->
        <!-- LATEST DETECTION -->
        <!-- ================================================= -->

        <div class="card">

            <div class="card-header">

                <h3>

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    Latest Detection

                </h3>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>Time</th>

                        <th>Pests</th>

                    </tr>

                </thead>


                <tbody id="historyTable">

                    <tr>

                        <td>10:15 AM</td>

                        <td>12</td>

                    </tr>

                </tbody>

            </table>

        </div>


    </section>


</main>



<!-- ================================================= -->
<!-- DASHBOARD JAVASCRIPT -->
<!-- ================================================= -->

<script
    type="module"
    src="dashboard.js"
></script>


</body>

</html>
