<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-RICE Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= TOP NAVBAR ================= -->

<header class="navbar">

    <div class="logo">
        <i class="fa-solid fa-seedling"></i>
        <span>AR-RICE</span>
    </div>

    <div class="navbar-right">
        <button id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>
    </div>

</header>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="menu-title">
        MENU
    </div>

    <button class="menu-btn active">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </button>

    <button class="menu-btn">
        <i class="fa-solid fa-video"></i>
        Camera
    </button>

    <button class="menu-btn">
        <i class="fa-solid fa-bug"></i>
        Pest Detection
    </button>

    <button class="menu-btn">
        <i class="fa-solid fa-location-dot"></i>
        Robot Location
    </button>

</aside>



<!-- ================= MAIN CONTENT ================= -->

<main class="dashboard">

    <!-- Welcome -->
    <section class="welcome-card">

        <h1>Welcome Farmer!</h1>

        <p>
            AR-RICE monitors the rice field in real-time using the
            Raspberry Pi robot.
        </p>

    </section>



    <!-- ================= TOP CARDS ================= -->

    <section class="cards">

        <!-- Camera -->

        <div class="card large-card">

            <div class="card-header">

                <h3>
                    <i class="fa-solid fa-video"></i>
                    Live Camera
                </h3>

            </div>

            <div class="camera-feed">

                <img
                    id="cameraFeed"
                    src="images/camera-placeholder.png"
                    alt="Camera Feed">

            </div>

        </div>



        <!-- Right Side -->

        <div class="right-column">

            <!-- Pest Count -->

            <div class="card small-card">

                <div class="card-header">

                    <h3>
                        <i class="fa-solid fa-bug"></i>
                        Detected Pests
                    </h3>

                </div>

                <div class="big-number"
                     id="pestCount">

                    12

                </div>

            </div>



            <!-- Robot Location -->

            <div class="card small-card">

                <div class="card-header">

                    <h3>
                        <i class="fa-solid fa-location-dot"></i>
                        Robot Location
                    </h3>

                </div>

                <div class="location-text"
                     id="robotLocation">

                    Field Zone A3

                </div>

            </div>

        </div>

    </section>



    <!-- ================= SECOND ROW ================= -->

    <section class="cards second-row">

        <!-- Robot Status -->

        <div class="card">

            <h3>Robot Status</h3>

            <div class="status">

                <div>

                    <span>Battery</span>

                    <strong id="battery">95%</strong>

                </div>

                <div>

                    <span>Temperature</span>

                    <strong id="temperature">32°C</strong>

                </div>

                <div>

                    <span>Connection</span>

                    <strong class="online">

                        Online

                    </strong>

                </div>

            </div>

        </div>



        <!-- Detection History -->

        <div class="card">

            <h3>Latest Detection</h3>

            <table>

                <thead>

                <tr>

                    <th>Time</th>

                    <th>Pests</th>

                </tr>

                </thead>

                <tbody id="historyTable">

                <tr>

                    <td>10:15 AM</td>

                    <td>12</td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
