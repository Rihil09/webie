<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-RICE System</title>
    <link rel="stylesheet" href="style0.2.css">
</head>
<body>

    <div class="container">

        <!-- LEFT SIDE TEXT -->
        <div class="left-content">
            <h1>WELCOME FARMER!</h1>
            <p>Rice farming plays a crucial role in the agricultural sector.</p>
        </div>

        <!-- RIGHT SIDE LOGIN/REGISTER -->
        <div class="wrapper">

            <!-- LOGIN -->
            <div class="form-box login active">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-box">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="input-box">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p>
                        Don't have an account?
                        <a href="#" id="showRegister">Register</a>
                    </p>
                </form>
            </div>

            <!-- REGISTER -->
            <div class="form-box register">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="input-box">
                        <input type="text" id="registerUsername" placeholder="Username" required>
                    </div>
                    <div class="input-box">
                        <input type="email" id="registerEmail" placeholder="Email" required>
                    </div>
                    <div class="input-box">
                        <input type="password" id="registerPassword" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">Register</button>
                    <p>
                        Already have an account?
                        <a href="#" id="showLogin">Login</a>
                    </p>
                </form>
            </div>

        </div>

    </div>

    <script type="module" src="script0.2.js"></script>
</body>
</html>
