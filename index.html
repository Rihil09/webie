<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR-RICE Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="wrapper">

        <!-- LOGIN FORM -->

        <div class="form-box login active">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        required
                    >
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

                <p>
                    Don't have an account?
                    <a href="#" id="showRegister">
                        Register
                    </a>
                </p>

            </form>

        </div>


        <!-- REGISTER FORM -->

        <div class="form-box register">

            <h2>Register</h2>

            <form id="registerForm">

                <div class="input-box">
                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Username"
                        required
                    >
                </div>

                <div class="input-box">
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        required
                    >
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

                <p>
                    Already have an account?
                    <a href="#" id="showLogin">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>


    <!-- Firebase / Login JavaScript -->

    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
